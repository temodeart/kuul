<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Kuul — жагсаалтаас гарах</title>
<link rel="icon" href="../assets/logo/app-icon-brand.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..700,0..1,0&icon_names=check&display=block">
<link rel="stylesheet" href="../css/colors.css">
<link rel="stylesheet" href="../css/typography.css">
<link rel="stylesheet" href="../css/spacing.css">
<link rel="stylesheet" href="../css/effects.css">
<link rel="stylesheet" href="../css/landing.css">
<link rel="stylesheet" href="../css/legal.css">
</head>
<body class="legal">
<!-- The link in waitlist emails lands here. Unsubscribing takes a press, not just the visit:
     mail scanners open every link in a message. -->
<header class="legal-header">
  <div class="legal-header-inner">
    <a href="../" aria-label="Kuul — нүүр" class="nav-logo"><img src="../assets/logo/app-icon-brand.svg" alt="Kuul"></a>
    <a href="../" class="caps legal-back">← Нүүр хуудас</a>
  </div>
</header>
<main class="join">
  <div class="join-inner">
    <h2>Жагсаалтаас гарах уу?</h2>
    <p id="unsub-text">Kuul нээгдэхэд ирэх имэйлийг цаашид авахгүй.</p>
    <button class="join-cta" id="unsub" type="button">Жагсаалтаас гарах</button>
  </div>
</main>
<script>
(function () {
  const token = new URLSearchParams(location.search).get("t") || "";
  const API = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) ? "http://localhost:4000/v1" : "https://api.kuul.mn/v1";
  const btn = document.getElementById("unsub"), text = document.getElementById("unsub-text"), h = document.querySelector("h2");
  const fail = msg => { text.textContent = msg; btn.disabled = false; };
  if (!token) { h.textContent = "Холбоос дутуу байна"; text.textContent = "Имэйл дэх холбоосыг бүтнээр нь нээнэ үү."; btn.hidden = true; return; }
  btn.addEventListener("click", async () => {
    btn.disabled = true;
    try {
      const res = await fetch(API + "/waitlist/unsubscribe", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ token }),
      });
      if (res.ok) { h.textContent = "Жагсаалтаас гарлаа"; text.textContent = "Имэйл хаягийг чинь устгалаа, Kuul-ээс өөр имэйл ирэхгүй. Бодлоо өөрчилбөл нүүр хуудаснаас дахин бүртгүүлээрэй."; btn.hidden = true; return; }
      fail(res.status === 404 || res.status === 400 ? "Энэ холбоос хүчингүй байна." : "Алдаа гарлаа. Дахин оролдоно уу.");
    } catch {
      fail("Холбогдож чадсангүй. Дахин оролдоно уу.");
    }
  });
})();
</script>
</body>
</html>
